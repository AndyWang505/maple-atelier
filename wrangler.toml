name = "maple-atelier"
main = ".open-next/worker.js"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "maple-atelier"
database_id = "80c7142c-1b3c-4711-b7fa-68c0f7ac0eac"
migrations_dir = "drizzle"

# Prod overrides — `wrangler deploy --env production` 會 pick 這段。
# CF Workers Git deploy 把 `--env production` 寫在「部署命令」內。
[env.production]
name = "maple-atelier"

[[env.production.d1_databases]]
binding = "DB"
database_name = "maple-atelier-prod"
database_id = "794c4372-ab74-4dd4-8419-53106496adb3"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "d3cd3482eb3d4f73b9639fac82e335c5"

[[env.production.kv_namespaces]]
binding = "NEXT_INC_CACHE_KV"
id = "77d4e262381b464e9dc1b40b0ff3f08f"
